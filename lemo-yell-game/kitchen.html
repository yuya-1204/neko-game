<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffb703">
  <meta name="description" content="数、順番、記憶、分類、等分、お会計を段階的に楽しむレモエールキッチン。">
  <title>レモエールキッチン｜レモエールくんゲーム</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="app-page kitchen-page">
  <a class="skip-link" href="#main">ゲーム画面へ</a>

  <header class="compact-header">
    <a class="back-link" href="index.html" aria-label="ゲーム選択へ戻る">←</a>
    <div>
      <p class="eyebrow">レモエールくんゲーム</p>
      <h1>レモエールキッチン</h1>
    </div>
    <button class="sound-button" id="soundButton" type="button" aria-pressed="true">音 ON</button>
  </header>

  <main id="main" class="app-shell">
    <section id="menuView" aria-labelledby="menuTitle">
      <div class="kitchen-intro">
        <img src="assets/pair.png" alt="レモエール君とレモミィちゃん">
        <div>
          <span class="pill">9つのミニゲーム・各7レベル</span>
          <h2 id="menuTitle">できそうなゲームから始めよう</h2>
          <p>クリアすると次のレベルが開きます。後半は、覚えることや考えることが少しずつ増えていくよ。</p>
        </div>
      </div>

      <div class="progress-panel" aria-label="全体の進み具合">
        <div>
          <span>キッチンスター</span>
          <strong id="totalStars">0 / 63</strong>
        </div>
        <div class="progress-track"><span id="totalProgress"></span></div>
        <button id="resetProgress" class="text-button" type="button">はじめから遊ぶ</button>
      </div>

      <div id="gameMenu" class="mini-game-grid"></div>
    </section>

    <section id="playView" class="play-view" hidden aria-labelledby="playTitle">
      <div class="play-topbar">
        <button id="backToMenu" class="secondary-button" type="button">← ゲーム一覧</button>
        <div class="level-status">
          <span id="levelBadge">レベル 1</span>
          <div class="level-dots" id="levelDots" aria-label="レベル進行"></div>
        </div>
      </div>

      <div class="play-heading">
        <div class="play-icon" id="playIcon" aria-hidden="true">🥤</div>
        <div>
          <p class="eyebrow" id="difficultyLabel">やさしい</p>
          <h2 id="playTitle">レモネードスタンド</h2>
          <p id="playInstruction">注文をよく見て、ぴったり作ろう。</p>
        </div>
      </div>

      <div class="challenge-row">
        <label class="switch-label">
          <input id="challengeMode" type="checkbox">
          <span>チャレンジモード</span>
        </label>
        <span id="challengeHelp">時間制限なしで遊べます</span>
      </div>

      <div class="character-message" id="characterMessage">
        <img id="messageCharacter" src="assets/lemomy.png" alt="レモミィちゃん">
        <p id="messageText">いっしょに、ゆっくりやってみよう！</p>
      </div>

      <div id="stage" class="game-stage" aria-live="polite"></div>
      <p id="liveMessage" class="sr-only" aria-live="assertive"></p>
    </section>
  </main>

  <dialog id="clearDialog" class="clear-dialog">
    <div class="clear-burst" aria-hidden="true">★</div>
    <h2>できたね！</h2>
    <p id="clearMessage">ぴったりできました。</p>
    <div class="dialog-actions">
      <button id="nextLevelButton" class="primary-button" type="button">つぎのレベルへ</button>
      <button id="menuButton" class="secondary-button" type="button">ゲーム一覧へ</button>
    </div>
  </dialog>

  <script src="kitchen.js"></script>
</body>
</html>
